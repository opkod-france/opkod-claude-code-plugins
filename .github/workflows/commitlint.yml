name: Commitlint

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # commitlint needs history to compare ranges.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install commitlint
        run: |
          npm install --no-save \
            @commitlint/cli@^19 \
            @commitlint/config-conventional@^19

      - name: Compute commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "from=${PR_BASE_SHA}" >> "$GITHUB_OUTPUT"
            echo "to=${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            # On push, lint the commits introduced by this push.
            # Initial push has before=0000...; fall back to last 10 commits.
            if [[ "$PUSH_BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              echo "from=HEAD~10" >> "$GITHUB_OUTPUT"
            else
              echo "from=${PUSH_BEFORE}" >> "$GITHUB_OUTPUT"
            fi
            echo "to=${PUSH_AFTER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run commitlint
        env:
          FROM: ${{ steps.range.outputs.from }}
          TO: ${{ steps.range.outputs.to }}
        run: |
          set -euo pipefail
          echo "Linting commits from $FROM to $TO"
          npx commitlint --from "$FROM" --to "$TO" --verbose
